<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ReDeal">
<title>ReDeal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cg transform='rotate(-14 10 16)'%3E%3Crect x='3.5' y='6.5' width='13' height='19' rx='3.2' fill='%231B7F3B'/%3E%3Cpath transform='translate(10 16)' stroke='white' stroke-width='1.7' d='M0-5.8V5.8M3-2.6C2.6-3.6 1.5-4.2 0-4.2-1.8-4.2-3-3.2-3-1.9-3 1 3-.4 3 2.2 3 3.5 1.7 4.4 0 4.4-1.6 4.4-2.8 3.7-3.2 2.6'/%3E%3C/g%3E%3Cg transform='rotate(12 22 16)'%3E%3Crect x='15.5' y='6.5' width='13' height='19' rx='3.2' fill='white' stroke='%23999' stroke-width='.6'/%3E%3Cpath transform='translate(22 16)' stroke='%231B7F3B' stroke-width='1.7' d='M0-5.8V5.8M3-2.6C2.6-3.6 1.5-4.2 0-4.2-1.8-4.2-3-3.2-3-1.9-3 1 3-.4 3 2.2 3 3.5 1.7 4.4 0 4.4-1.6 4.4-2.8 3.7-3.2 2.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav id="tabs" aria-label="Sections">
  <div class="brand" aria-hidden="true">
    <svg class="logo" viewBox="0 0 32 32" width="30" height="30" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="rotate(-14 10 16)">
        <rect x="3.5" y="6.5" width="13" height="19" rx="3.2" fill="#1B7F3B"/>
        <path transform="translate(10 16)" stroke="#fff" stroke-width="1.7" d="M0-5.8V5.8M3-2.6C2.6-3.6 1.5-4.2 0-4.2-1.8-4.2-3-3.2-3-1.9-3 1 3-.4 3 2.2 3 3.5 1.7 4.4 0 4.4-1.6 4.4-2.8 3.7-3.2 2.6"/>
      </g>
      <g transform="rotate(12 22 16)">
        <rect x="15.5" y="6.5" width="13" height="19" rx="3.2" fill="#fff" stroke="rgba(0,0,0,.16)" stroke-width=".6"/>
        <path transform="translate(22 16)" stroke="#1B7F3B" stroke-width="1.7" d="M0-5.8V5.8M3-2.6C2.6-3.6 1.5-4.2 0-4.2-1.8-4.2-3-3.2-3-1.9-3 1 3-.4 3 2.2 3 3.5 1.7 4.4 0 4.4-1.6 4.4-2.8 3.7-3.2 2.6"/>
      </g>
    </svg>
    <span>ReDeal</span>
  </div>
  <div class="tab-track">
    <div class="tab-ind" aria-hidden="true"></div>
    <button type="button" class="tab press" data-tab="subs"><span class="tab-icon" data-icon="card"></span><span class="tab-label">Plans</span></button>
    <button type="button" class="tab press" data-tab="pile"><span class="tab-icon" data-icon="pile"></span><span class="tab-label">Pile</span><span class="tab-badge" id="pile-badge" hidden></span></button>
    <button type="button" class="tab press" data-tab="activity"><span class="tab-icon" data-icon="clock"></span><span class="tab-label">Activity</span></button>
    <button type="button" class="tab press" data-tab="labs"><span class="tab-icon" data-icon="flask"></span><span class="tab-label">Labs</span></button>
  </div>
</nav>

<main id="main">
  <section class="view" id="view-subs" aria-label="Subscriptions"></section>
  <section class="view view-pile" id="view-pile" aria-label="Swipe Pile" hidden></section>
  <section class="view" id="view-activity" aria-label="Activity" hidden></section>
  <section class="view" id="view-labs" aria-label="Labs" hidden></section>
</main>

<div id="toasts" aria-live="polite"></div>
<noscript>ReDeal needs JavaScript.</noscript>
<script src="app.js" defer></script>
</body>
</html>
